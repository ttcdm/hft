[package]
name = "apex_hft_engine"
version = "0.1.0"
edition = "2021"
authors = ["Apex Quant Technologies"]
description = "Ultra-low latency autonomous execution & Avellaneda-Stoikov market making engine in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"
atomic_float = "1.0"
url = "2.5"
