name: Apex Quant Engine CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]  # node:sqlite needs >= 22.5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (ESLint & TypeScript)
        run: npm run lint

      - name: Run Test Suites
        run: npm test

      - name: Production Build Compilation
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/server.cjs || exit 1
          test -f dist/index.html || exit 1
          echo "Production artifacts verified successfully."

      - name: Runtime Smoke Test (boot bundle, auth, websocket)
        run: npm run smoke

      - name: Localnet end-to-end (real pump programs in an in-process bank, loopback only)
        run: npm run localnet:e2e

  validate-rust:
    name: Validate Rust HFT Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust Test Suites
        run: cargo test --workspace

      - name: Cargo Release Build
        run: cargo build --workspace --release
