version: '3.8'

services:
  apex-trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-quant-engine
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - JITO_BLOCK_ENGINE_URL=${JITO_BLOCK_ENGINE_URL:-https://mainnet.block-engine.jito.wtf}
      - JITO_TIP_ACCOUNT=${JITO_TIP_ACCOUNT:-96gYZGLnJYVFmbjzopPSU6QiEV5fGqZNyN9nmNhvrZU5}
      - DEFAULT_JITO_TIP_SOL=${DEFAULT_JITO_TIP_SOL:-0.005}
      - MEMECOIN_SNIPER_ENABLED=${MEMECOIN_SNIPER_ENABLED:-true}
      - CAPITAL_TIER=${CAPITAL_TIER:-MICRO_10}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
